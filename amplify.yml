version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "SANITY_WEBHOOK_SECRET=$SANITY_WEBHOOK_SECRET" >> .env.production
        - echo "SANITY_API_TOKEN=$SANITY_API_TOKEN" >> .env.production
        - echo "SANITY_API_READ_TOKEN=$SANITY_API_READ_TOKEN" >> .env.production
        - echo "SANITY_PREVIEW_SECRET=$SANITY_PREVIEW_SECRET" >> .env.production
        # Website lead form → Zoho CRM, and the ad mock-up's stock photos. Server-side only.
        - echo "ZOHO_CRM_CLIENT_ID=$ZOHO_CRM_CLIENT_ID" >> .env.production
        - echo "ZOHO_CRM_CLIENT_SECRET=$ZOHO_CRM_CLIENT_SECRET" >> .env.production
        - echo "ZOHO_CRM_REFRESH_TOKEN=$ZOHO_CRM_REFRESH_TOKEN" >> .env.production
        - echo "ZOHO_ACCOUNTS_URL=$ZOHO_ACCOUNTS_URL" >> .env.production
        - echo "ZOHO_API_URL=$ZOHO_API_URL" >> .env.production
        - echo "ZOHO_LEAD_RULE_ID=$ZOHO_LEAD_RULE_ID" >> .env.production
        - echo "MOCKUP_COOKIE_SECRET=$MOCKUP_COOKIE_SECRET" >> .env.production
        - echo "MOCKUP_TESTER_KEY=$MOCKUP_TESTER_KEY" >> .env.production
        - echo "STAFF_MAIL_FROM=$STAFF_MAIL_FROM" >> .env.production
        - echo "STAFF_MAIL_REGION=$STAFF_MAIL_REGION" >> .env.production
        - echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env.production
        - echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env.production
        - echo "NEXT_PUBLIC_SANITY_PROJECT_ID=$NEXT_PUBLIC_SANITY_PROJECT_ID" >> .env.production
        - echo "NEXT_PUBLIC_SANITY_DATASET=$NEXT_PUBLIC_SANITY_DATASET" >> .env.production
        # Inventory pages preview (sample data) on the staging branch only — no effect on main/production.
        - if [ "$AWS_BRANCH" = "staging" ]; then echo "INVENTORY_PREVIEW=1" >> .env.production; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
